name: Deploy Quiz App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without Docker cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-quiz-app
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Sync source files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/root/quiz-app-python/"
          rm: false

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/quiz-app-python

            echo "=== Building image on server ==="
            if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
              docker compose build --no-cache
            else
              docker compose build
            fi

            echo "=== Deploying container ==="
            docker compose up -d --no-build --force-recreate --no-deps web

            echo "=== Health check (waiting 15s) ==="
            sleep 15
            RETRIES=3
            HEALTHY=false
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/health || echo "FAIL")
              echo "Attempt $i: Health=$STATUS"
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                break
              fi
              if [ "$i" -lt "$RETRIES" ]; then
                echo "Retrying in 10s..."
                sleep 10
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "=== Deploy successful ==="
              docker image prune -f || true
            else
              echo "=== HEALTH CHECK FAILED ==="
              docker compose logs --tail 50 web
              exit 1
            fi

      - name: Refresh docs spec
        if: success()
        run: |
          echo "=== Notifying docs service to refresh spec ==="
          curl -s -X POST https://docs.laurence.computer/api/services/quiz-app/refresh \
            -H "X-Admin-Key: ${{ secrets.DOCS_ADMIN_KEY }}" \
            -w "\nHTTP %{http_code}\n" || echo "Docs refresh failed (non-blocking)"
